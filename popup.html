<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Canais</title>
<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --surface: #f7f7f8;
    --border: #e4e4e7;
    --text: #111113;
    --muted: #75757b;
    --youtube: #d92323;
    --twitch: #9146ff;
    --green: #16a34a;
    --green-bg: rgba(22, 163, 74, 0.1);
    --danger: #dc2626;
  }

  * { box-sizing: border-box; }

  body {
    width: 360px;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 12px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px 10px;
  }
  .header-left { display: flex; align-items: center; gap: 8px; }
  .header-left img { width: 22px; height: 22px; border-radius: 5px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: -0.3px; }

  .settings {
    display: flex; gap: 4px; align-items: center;
    font-size: 11px; color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
  }
  .settings input {
    width: 28px;
    background: transparent;
    border: none;
    color: var(--text);
    text-align: center;
    font-size: 11px;
  }

  .tabs {
    display: flex;
    gap: 18px;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 8px 0 9px;
    cursor: pointer;
    color: var(--muted);
    font-weight: 600;
    font-size: 12.5px;
    border-bottom: 2.5px solid transparent;
    margin-bottom: -1px;
  }
  .tab.active { color: var(--text); }
  .tab[data-platform="youtube"].active { border-color: var(--youtube); color: var(--youtube); }
  .tab[data-platform="twitch"].active { border-color: var(--twitch); color: var(--twitch); }
  .tab[data-platform="kick"].active { border-color: #53fc18; color: #2f8a0a; }

  #add-form { padding: 12px 14px; border-bottom: 1px solid var(--border); }

  .search-wrap { position: relative; margin-bottom: 10px; }
  #handle-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 9px 34px 9px 14px;
    font-size: 12.5px;
    outline: none;
  }
  #handle-input:focus { border-color: var(--muted); }
  .search-wrap .search-icon {
    position: absolute;
    right: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
    font-size: 13px;
  }

  .form-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }
  .checks { display: flex; gap: 14px; }
  .switch-label {
    display: flex; align-items: center; gap: 6px;
    color: var(--text); font-size: 12px; cursor: pointer;
  }
  .switch {
    position: relative; width: 30px; height: 17px; flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0;
    background: var(--border);
    border-radius: 999px;
    transition: background 0.15s;
  }
  .switch .track::before {
    content: "";
    position: absolute;
    width: 13px; height: 13px;
    left: 2px; top: 2px;
    background: white;
    border-radius: 50%;
    transition: transform 0.15s;
    box-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .switch input:checked + .track { background: var(--green); }
  .switch input:checked + .track::before { transform: translateX(13px); }

  #add-form .add-btn {
    display: flex; align-items: center; gap: 4px;
    background: none;
    border: none;
    color: var(--green);
    font-weight: 700;
    font-size: 12.5px;
    cursor: pointer;
    padding: 4px 2px;
    white-space: nowrap;
  }
  #add-form .add-btn:hover { opacity: 0.75; }

  #list { max-height: 260px; overflow-y: auto; padding: 8px 14px 4px; display: flex; flex-direction: column; gap: 6px; }
  #list::-webkit-scrollbar { width: 4px; }
  #list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .channel {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    position: relative;
  }
  .channel.paused { opacity: 0.45; }

  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 14px;
  }

  .info { flex: 1; min-width: 0; }
  .info .handle-row { display: flex; align-items: baseline; gap: 6px; }
  .info .handle { font-weight: 600; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info .platform-label { color: var(--muted); font-size: 10.5px; }
  .info .status { color: var(--muted); font-size: 10.5px; }
  .info .status.live-status { color: var(--green); font-weight: 600; }

  .actions { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
  .icon-btn {
    width: 26px; height: 26px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    border-radius: 7px;
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .icon-btn.on { border-color: var(--green); color: var(--green); background: var(--green-bg); }
  .icon-btn.disabled { opacity: 0.35; cursor: default; pointer-events: none; }
  .icon-btn.remove:hover { border-color: var(--danger); color: var(--danger); }
  .icon-btn.checking { animation: spin 0.8s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .icon-btn svg { display: block; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(17, 17, 19, 0.32);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }

  .options-panel {
    background: var(--bg);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16);
    width: 280px;
    max-width: 88%;
    overflow: hidden;
  }

  .options-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
  }
  .options-panel-header .title { font-weight: 700; font-size: 13px; }
  .options-panel-header .close-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    width: 26px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 7px;
  }
  .options-panel-header .close-btn:hover { background: var(--surface); color: var(--text); }

  .options-panel button.item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
    width: 100%;
    background: none; border: none;
    color: var(--text);
    padding: 12px 14px;
    font-size: 12.5px;
    cursor: pointer;
    text-align: left;
  }
  .options-panel button.item:hover { background: var(--surface); }
  .options-panel button.item + button.item { border-top: 1px solid var(--border); }
  .menu-item-label { display: flex; align-items: center; gap: 8px; color: var(--muted); flex-shrink: 0; }
  .menu-item-label svg { flex-shrink: 0; }

  #empty { padding: 22px 14px; color: var(--muted); text-align: center; }

  footer {
    padding: 8px 14px 10px;
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid var(--border);
  }
  footer button {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 11px;
    text-decoration: underline;
    padding: 2px;
  }
  #check-status { color: var(--muted); font-size: 10.5px; }
</style>
</head>
<body>
  <header>
    <div class="header-left">
      <img src="icons/icon48.png" alt="" />
      <h1>Canais</h1>
    </div>
    <label class="settings">
      Intervalo: <input type="number" id="interval-input" min="1" max="60" value="5" /> min
    </label>
  </header>

  <div class="tabs">
    <div class="tab active" data-platform="youtube">YouTube</div>
    <div class="tab" data-platform="kick">Kick</div>
    <div class="tab" data-platform="twitch">Twitch</div>
  </div>

  <form id="add-form">
    <div class="search-wrap">
      <input type="text" id="handle-input" placeholder="@canal ou url" required autocomplete="off" />
      <span class="search-icon"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" /></svg></span>
    </div>
    <div class="form-row">
      <div class="checks">
        <label class="switch-label">
          <span class="switch"><input type="checkbox" id="notify-check" checked /><span class="track"></span></span>
          Notificar
        </label>
        <label class="switch-label">
          <span class="switch"><input type="checkbox" id="autoopen-check" /><span class="track"></span></span>
          Abrir auto
        </label>
      </div>
      <button type="submit" class="add-btn">+ Adicionar</button>
    </div>
  </form>

  <div id="list"></div>
  <div id="empty" style="display:none">Nenhum canal monitorado.</div>

  <footer>
    <button id="check-now">Verificar todos agora</button>
    <span id="check-status"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
